services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: agrinexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrinexus
      POSTGRES_USER: agrinexus
      POSTGRES_PASSWORD: agrinexus_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrinexus -d agrinexus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: